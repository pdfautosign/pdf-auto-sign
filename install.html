<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c68"><meta name="description" content="Install PDF Auto Sign on your Android phone"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.png"><title>Install PDF Auto Sign</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#16324a;font:16px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:480px;margin:0 auto;padding:36px 22px 45px}.card{background:white;border-radius:22px;padding:28px 24px;box-shadow:0 12px 35px #123c6815;text-align:center}.logo{width:90px;height:90px;border-radius:20px}.muted{color:#657b8c;font-size:14px}h1{font-size:25px;margin:14px 0 4px}button,.link{font:inherit;border:0;border-radius:12px;padding:14px 16px;width:100%;display:block;text-decoration:none;cursor:pointer}button{background:#1769a6;color:white;font-weight:700;margin:22px 0 10px}.link{background:#eaf2f9;color:#155d91;font-weight:600}#guide{text-align:left;background:#f3f7fb;padding:14px 17px;border-radius:12px;margin-top:16px;font-size:14px}ol{padding-left:22px;margin:7px 0}select{font:inherit;border:1px solid #d0dce6;padding:8px;border-radius:8px;background:white}#status{font-size:13px;color:#526d7c;min-height:20px;margin-top:12px}</style></head><body><main class="wrap"><div class="card"><img class="logo" src="./icon-512.png" alt="PDF Auto Sign"><h1>PDF Auto Sign</h1><p class="muted" id="subtitle">手机 PDF 签名工具 · V1.4.9</p><select id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select><button id="install">安装 PDF Auto Sign</button><a class="link" href="/" id="open">直接打开软件</a><div id="guide" hidden></div><div id="status" aria-live="polite"></div></div></main><script>
const T={zh:{sub:'手机 PDF 签名工具 · V1.4.9',install:'安装 PDF Auto Sign',open:'直接打开软件',guide:'如果没有弹出安装窗口：',steps:['请使用 Android 手机的 Chrome 打开本页面','点击 Chrome 右上角 ⋮','选择「安装应用」或「添加到主屏幕」'],notready:'浏览器尚未提供一键安装，请按下面步骤操作。',installed:'已经安装！可从手机主屏幕打开。',ios:'iPhone：请使用 Safari，点分享 → 加入主屏幕。'},en:{sub:'PDF signing app for mobile · V1.4.9',install:'Install PDF Auto Sign',open:'Open the app',guide:'If no installation dialog appears:',steps:['Open this page in Chrome on Android','Tap the ⋮ menu in Chrome','Select Install app or Add to Home screen'],notready:'One-tap installation is not available yet. Follow the steps below.',installed:'Installed! Open it from your home screen.',ios:'iPhone: use Safari → Share → Add to Home Screen.'},ms:{sub:'Aplikasi tandatangan PDF · V1.4.9',install:'Pasang PDF Auto Sign',open:'Buka aplikasi',guide:'Jika tetingkap pemasangan tidak muncul:',steps:['Buka halaman ini menggunakan Chrome pada Android','Tekan menu ⋮ di Chrome','Pilih Install app atau Add to Home screen'],notready:'Pemasangan satu sentuhan belum tersedia. Ikut langkah di bawah.',installed:'Berjaya dipasang! Buka dari skrin utama.',ios:'iPhone: guna Safari → Kongsi → Tambah ke Skrin Utama.'}};
let deferred=null;const el=id=>document.getElementById(id);function language(){return T[el('lang').value]}function render(){const t=language();el('subtitle').textContent=t.sub;el('install').textContent=t.install;el('open').textContent=t.open;el('guide').innerHTML='<b>'+t.guide+'</b><ol>'+t.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'}function showGuide(){el('guide').hidden=false;const t=language();el('status').textContent=/iPhone|iPad|iPod/i.test(navigator.userAgent)?t.ios:t.notready}el('lang').onchange=()=>{render();if(!el('guide').hidden)showGuide()};render();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;el('guide').hidden=true;el('status').textContent=''});el('install').onclick=async()=>{if(!deferred){showGuide();return}const p=deferred;deferred=null;try{await p.prompt();const result=await p.userChoice;if(result.outcome!=='accepted')showGuide()}catch(e){showGuide()}};window.addEventListener('appinstalled',()=>{el('guide').hidden=true;el('status').textContent=language().installed});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
